name: Cron — calendar + PR sync

# Vercel Hobby caps cron jobs at once-per-day. The two frequent jobs run
# here instead; mark-stale-prs stays in vercel.json (daily is fine).
#
# Required repo settings (Settings → Secrets and variables → Actions):
#   Variable  APP_URL       e.g. https://engineering-os.vercel.app
#   Secret    CRON_SECRET   same value as Vercel env var

on:
  schedule:
    - cron: "*/30 * * * *"  # sync-calendars
    - cron: "0 * * * *"     # sync-prs
  workflow_dispatch:
    inputs:
      job:
        description: "Which endpoint to hit"
        required: true
        default: sync-calendars
        type: choice
        options: [sync-calendars, sync-prs]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve target endpoint
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 * * * *" ]; then
            echo "path=sync-prs" >> "$GITHUB_OUTPUT"
          else
            echo "path=sync-calendars" >> "$GITHUB_OUTPUT"
          fi

      - name: Hit ${{ steps.target.outputs.path }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL variable or CRON_SECRET secret is missing"
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/${{ steps.target.outputs.path }}"
